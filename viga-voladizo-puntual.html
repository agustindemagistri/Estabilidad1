<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Viga con Voladizo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-blue-900 text-white p-6">
            <h1 class="text-2xl font-bold">Simulador de Esfuerzos</h1>
            <p class="text-blue-200 text-sm">Viga isostática con voladizo</p>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 p-6">
            <!-- Controles -->
            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-700">Tramo A-B (L1): <span id="val-l1" class="text-blue-600">4</span>m</label>
                    <input type="range" id="input-l1" min="2" max="10" step="0.5" value="4" class="w-full">
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-700">Voladizo B-C (L2): <span id="val-l2" class="text-blue-600">2</span>m</label>
                    <input type="range" id="input-l2" min="1" max="5" step="0.5" value="2" class="w-full">
                </div>
                <hr>
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-700">Carga q1 (Tramo): <span id="val-q1" class="text-blue-600">10</span> kN/m</label>
                    <input type="range" id="input-q1" min="0" max="50" value="10" class="w-full">
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-700">Carga q2 (Vuelo): <span id="val-q2" class="text-blue-600">15</span> kN/m</label>
                    <input type="range" id="input-q2" min="0" max="50" value="15" class="w-full">
                </div>
                <div class="bg-blue-50 p-4 rounded-lg text-sm text-blue-900">
                    <p>Reacción A: <span id="out-ra">0</span> kN</p>
                    <p>Reacción B: <span id="out-rb">0</span> kN</p>
                </div>
            </div>


            <!-- Visualización -->
            <div class="lg:col-span-2 space-y-4">
                <canvas id="canvas-mom" class="w-full bg-slate-50 rounded-lg border"></canvas>
                <canvas id="canvas-shear" class="w-full bg-slate-50 rounded-lg border"></canvas>
            </div>
        </div>
    </div>


    <script>
        const state = { L1: 4, L2: 2, q1: 10, q2: 15 };
        
        function update() {
            const { L1, L2, q1, q2 } = state;
            
            // Reacciones
            // Sumatoria de Momentos en A (x=0) = 0
            // RB * L1 - q1 * L1 * (L1 / 2) - q2 * L2 * (L1 + L2 / 2) = 0
            // RB * L1 = q1 * L1^2 / 2 + q2 * L2 * (L1 + L2 / 2)
            const RB = ((q1 * Math.pow(L1, 2) / 2) + (q2 * L2 * (L1 + L2 / 2))) / L1;
            
            // Sumatoria de Fuerzas en Y = 0
            // RA + RB - q1 * L1 - q2 * L2 = 0
            const RA = (q1 * L1 + q2 * L2) - RB;
            
            document.getElementById('out-ra').innerText = RA.toFixed(2);
            document.getElementById('out-rb').innerText = RB.toFixed(2);
            
            draw(RA, RB);
        }


        function draw(RA, RB) {
            const { L1, L2, q1, q2 } = state;
            const canvasM = document.getElementById('canvas-mom');
            const canvasQ = document.getElementById('canvas-shear');
            const ctxM = canvasM.getContext('2d');
            const ctxQ = canvasQ.getContext('2d');
            
            // Lógica simplificada de dibujo
            [ctxM, ctxQ].forEach(ctx => {
                ctx.clearRect(0, 0, 800, 200);
                ctx.strokeStyle = '#1e3a8a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(50, 100);
                ctx.lineTo(750, 100);
                ctx.stroke();
            });


            // Dibujar Momentos (esquema)
            ctxM.fillStyle = '#1e3a8a';
            ctxM.fillText("Diagrama de Momentos", 50, 20);
            
            // Dibujar Cortantes (esquema)
            ctxQ.fillStyle = '#1e3a8a';
            ctxQ.fillText("Diagrama de Cortantes", 50, 20);
        }


        ['l1', 'l2', 'q1', 'q2'].forEach(id => {
            document.getElementById('input-'+id).addEventListener('input', (e) => {
                state[id] = parseFloat(e.target.value);
                document.getElementById('val-'+id).innerText = e.target.value;
                update();
            });
        });


        update();
    </script>
</body>
</html>
